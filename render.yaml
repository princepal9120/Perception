services:
  - type: web
    name: perception-server
    runtime: docker
    repo: https://github.com/princepal9120/Perception
    region: oregon
    plan: free
    branch: main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7

      # Database Settings
      - key: DB_POOL_SIZE
        value: 10
      - key: DB_MAX_OVERFLOW
        value: 20

      # Upstash Redis REST API
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # External APIs
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

      # Vector DB
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: quickstart

      # Clerk Auth
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false

      # App Config
      - key: CORS_ORIGINS
        value: "*" # Update with frontend URL in dashboard
      - key: RATE_LIMIT_MESSAGES_PER_MINUTE
        value: 20
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60

    dockerContext: server
    dockerfilePath: server/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
